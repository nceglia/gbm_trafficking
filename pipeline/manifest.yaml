  traffic_drainage_rewiring:
    file: traffic_drainage_rewiring.py
    tier: traffic_tcr
    lineage: tcell
    tcr_required: true
    # Consolidated: subsumes the legacy traffic_draining_ot,
    # figure_cd8_drainage_amplitude, and figure_cd8_rewiring_amplitude
    # steps. Runs OT + permutation + GSEA + panel rendering for every
    # directed (src → dst) transition × lineage. Empty transitions are
    # skipped gracefully (no outputs written for those sub-dirs).
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - results/traffic_archetype_graphs/clone_archetypes.csv
    writes:
      - results/traffic_drainage_rewiring/run_summary.csv
      # CSF → TP (the historically populated transition; guaranteed)
      - results/traffic_drainage_rewiring/CSF_to_TP/CD8/panel.png
