# GBM trafficking pipeline manifest — single source of truth for DAG, docs, and Snakemake.
# Regenerate pipeline/dag.md: python pipeline/workflow/render_from_manifest.py

version: 1

# Manual prerequisites (not in snakemake rule all)
data_prep:
  - id: run_celltyping_workflow
    file: scripts/run_celltyping_workflow.py
    writes: [data/objects/GBM_TCR_POS_TCELLS.h5ad]
    note: External 10x + signature tables; see README
  - id: standardize_myeloid_object
    file: scripts/standardize_myeloid_object.py
    writes: [data/objects/MYELOID_GBM.h5ad]
  - id: build_combined_object
    file: scripts/build_combined_object.py
    writes: [data/objects/GBM_TCR_POS_TCELLS_MYELOID_combined.h5ad]
    note: Use Scrublet-filtered T cells (paths.H5AD_TCELLS) when rebuilding combined
  - id: build_pathway_family_maps
    file: scripts/build_hallmark_family_map.py
    note: Also build_gobp_family_map.py, build_kegg_family_map.py → modules/pathway_families_*.tsv

steps:
  qc_scrublet_doublets:
    file: qc_scrublet_doublets.py
    tier: qc
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS.h5ad]
    writes:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - results/qc_doublets/scrublet_summary.csv
    depends_on: []
    resources: {mem_mb: 32000, runtime: 120}

  pathway_temporal_scores_tcell:
    file: pathway_temporal_scores_tcell.py
    tier: pathway_tcell
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/10_temporal_scores/pathway_definitions.csv
      - results/10_temporal_scores/temporal_composition_tcell.csv
    depends_on: [qc_scrublet_doublets]
    resources: {mem_mb: 32000, runtime: 180}

  pathway_temporal_scores_myeloid:
    file: pathway_temporal_scores_myeloid.py
    tier: pathway_myeloid
    lineage: myeloid
    reads:
      - data/objects/MYELOID_GBM.h5ad
      - results/10_temporal_scores/pathway_definitions.csv
    writes:
      - results/10_temporal_scores/temporal_composition_myeloid.csv
    depends_on: [pathway_temporal_scores_tcell]
    resources: {mem_mb: 32000, runtime: 180}

  pathway_cross_lineage_corr:
    file: pathway_cross_lineage_corr.py
    tier: pathway_cross
    lineage: cross
    reads:
      - results/10_temporal_scores/temporal_composition_tcell.csv
      - results/10_temporal_scores/temporal_composition_myeloid.csv
    writes:
      - results/11_cross_lineage_correlations/pathway_correlations.csv
    depends_on: [pathway_temporal_scores_tcell, pathway_temporal_scores_myeloid]
    resources: {mem_mb: 16000, runtime: 60}

  pathway_cross_lineage_corr_fine:
    file: pathway_cross_lineage_corr_fine.py
    tier: pathway_cross
    lineage: cross
    reads:
      - results/10_temporal_scores/temporal_composition_tcell.csv
      - results/10_temporal_scores/temporal_composition_myeloid.csv
    writes:
      - results/11_cross_lineage_correlations/phenotype_correlations.csv
    depends_on: [pathway_temporal_scores_tcell, pathway_temporal_scores_myeloid]
    resources: {mem_mb: 16000, runtime: 60}

  pathway_de_gsea_prerank:
    file: pathway_de_gsea_prerank.py
    tier: pathway_tcell
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/04_pseudobulk_de_gsea/clone_pseudobulk_gsea_dotheatmap_GO_Biological_Process_2023.png
    depends_on: [qc_scrublet_doublets]
    resources: {mem_mb: 32000, runtime: 240}

  pathway_de_gsea_myeloid:
    file: pathway_de_gsea_myeloid.py
    tier: pathway_myeloid
    lineage: myeloid
    reads: [data/objects/MYELOID_GBM.h5ad]
    writes:
      - results/04_pseudobulk_de_gsea_myeloid/sample_pseudobulk_gsea_summary.csv
    depends_on: []
    resources: {mem_mb: 32000, runtime: 240}

  pathway_tissue_ternary:
    file: pathway_tissue_ternary.py
    tier: pathway_tcell
    lineage: tcell
    reads:
      - results/04_pseudobulk_de_gsea/clone_pseudobulk_gsea_dotheatmap_GO_Biological_Process_2023.png
    writes:
      - results/04_pseudobulk_de_gsea/pathway_ternary_GO_Biological_Process_2023_zscore.png
    depends_on: [pathway_de_gsea_prerank]
    resources: {mem_mb: 8000, runtime: 30}

  pathway_coenrichment_graph:
    file: pathway_coenrichment_graph.py
    tier: pathway_tcell
    lineage: tcell
    reads:
      - results/04_pseudobulk_de_gsea/clone_pseudobulk_gsea_dotheatmap_GO_Biological_Process_2023.png
    writes:
      - results/04_pseudobulk_de_gsea/pathway_coenrichment_GO_Biological_Process_2023.png
    depends_on: [pathway_de_gsea_prerank]
    resources: {mem_mb: 16000, runtime: 60}

  pathway_proximity_network:
    file: pathway_proximity_network.py
    tier: pathway_tcell
    lineage: tcell
    reads:
      - results/04_pseudobulk_de_gsea/clone_pseudobulk_gsea_dotheatmap_GO_Biological_Process_2023.png
    writes:
      - results/04_pseudobulk_de_gsea/networks/network_gobp_CD8.png
    depends_on: [pathway_de_gsea_prerank]
    resources: {mem_mb: 16000, runtime: 60}

  traffic_tissue_separability:
    file: traffic_tissue_separability.py
    tier: traffic_tcr
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/03_tissue_separability/augur_results_cache.pkl
    depends_on: [qc_scrublet_doublets]
    cli_extra: ["--lineage", "tcell"]
    resources: {mem_mb: 32000, runtime: 180}

  traffic_tissue_separability_myeloid:
    file: traffic_tissue_separability.py
    tier: pathway_myeloid
    lineage: myeloid
    reads: [data/objects/MYELOID_GBM.h5ad]
    writes:
      - results/03_tissue_separability_myeloid/augur_results_cache.pkl
    depends_on: []
    cli_extra: ["--lineage", "myeloid"]
    resources: {mem_mb: 32000, runtime: 180}

  traffic_transcriptome_cosine:
    file: traffic_transcriptome_cosine.py
    tier: traffic_tcr
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/transcriptome_similarity/cosine_distance_summary.csv
    depends_on: [qc_scrublet_doublets]
    cli_extra: ["--lineage", "tcell"]
    resources: {mem_mb: 32000, runtime: 120}

  traffic_transcriptome_cosine_myeloid:
    file: traffic_transcriptome_cosine.py
    tier: pathway_myeloid
    lineage: myeloid
    reads: [data/objects/MYELOID_GBM.h5ad]
    writes:
      - results/transcriptome_similarity_myeloid/cosine_distance_summary.csv
    depends_on: []
    cli_extra: ["--lineage", "myeloid"]
    resources: {mem_mb: 32000, runtime: 120}

  traffic_migration_rates:
    file: traffic_migration_rates.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/06c_empirical_Q/P_empirical.csv
      - results/06c_empirical_Q/migration_rates.csv
    depends_on: [qc_scrublet_doublets]
    resources: {mem_mb: 32000, runtime: 240}

  traffic_migration_rates_per_tp:
    file: traffic_migration_rates_per_tp.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/06d_empirical_Q_per_timepoint/block_retention_per_timepoint.csv
    depends_on: [qc_scrublet_doublets]
    resources: {mem_mb: 32000, runtime: 240}

  traffic_migration_rates_figures:
    file: traffic_migration_rates_figures.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [results/06c_empirical_Q/P_empirical.csv]
    writes:
      - results/06c_empirical_Q/figures/migration_heatmap.png
    depends_on: [traffic_migration_rates]
    resources: {mem_mb: 8000, runtime: 30}

  traffic_bayesian_comparison:
    file: traffic_bayesian_comparison.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - results/06c_empirical_Q/P_empirical.csv
    writes:
      - results/06f_bayesian_comparison/bayesian_summary.csv
      - results/06f_bayesian_comparison/bayesian_vs_empirical.png
    depends_on: [qc_scrublet_doublets, traffic_migration_rates]
    resources: {mem_mb: 16000, runtime: 360, gres: gpu:1}

  traffic_bayesian_sankey:
    file: traffic_bayesian_sankey.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/06g_bayesian_sankey/empirical_vs_bayesian_summary.csv
    depends_on: [qc_scrublet_doublets, traffic_migration_rates]
    resources: {mem_mb: 16000, runtime: 360, gres: gpu:1}

  traffic_branch_empirics:
    file: traffic_branch_empirics.py
    tier: traffic_tcr
    lineage: tcell
    tcr_required: true
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - results/10_temporal_scores/temporal_composition_myeloid.csv
    writes:
      - results/06_branch_empirics/branch_empirics_main.png
      - results/06_branch_empirics/branches.csv
    depends_on: [qc_scrublet_doublets, pathway_temporal_scores_myeloid]
    resources: {mem_mb: 32000, runtime: 180}

  traffic_branch_dispersion:
    file: traffic_branch_dispersion.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/branch_dispersion/stayer_vs_mover_table.csv
    depends_on: [qc_scrublet_doublets]
    resources: {mem_mb: 16000, runtime: 120}

  traffic_branch_dispersion_jsd:
    file: traffic_branch_dispersion_jsd.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [results/06_branch_empirics/branches.csv]
    writes:
      - results/branch_dispersion_jsd/dispersion_summary.csv
    depends_on: [traffic_branch_empirics]
    resources: {mem_mb: 16000, runtime: 60}

  traffic_branch_dispersion_switching:
    file: traffic_branch_dispersion_switching.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [results/06_branch_empirics/branches.csv]
    writes:
      - results/branch_dispersion_switching/switching_summary.csv
    depends_on: [traffic_branch_empirics]
    resources: {mem_mb: 16000, runtime: 60}

  traffic_branch_dispersion_temporal:
    file: traffic_branch_dispersion_temporal.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - results/06d_empirical_Q_per_timepoint/block_retention_per_timepoint.csv
      - results/06c_empirical_Q/migration_rates.csv
    writes:
      - results/branch_dispersion_temporal/render_check.txt
    depends_on: [traffic_migration_rates, traffic_migration_rates_per_tp]
    resources: {mem_mb: 16000, runtime: 120}

  traffic_clonality:
    file: traffic_clonality.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/clonality/clonality_summary.png
    depends_on: [qc_scrublet_doublets]
    resources: {mem_mb: 16000, runtime: 60}

  traffic_clonal_persistence:
    file: traffic_clonal_persistence.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/07_clonal_trafficking/cd8_clone_network.png
    depends_on: [qc_scrublet_doublets]
    resources: {mem_mb: 16000, runtime: 120}

  traffic_temporal_trajectories:
    file: traffic_temporal_trajectories.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/09_temporal/pathway_scores_per_pseudobulk.csv
    depends_on: [qc_scrublet_doublets]
    resources: {mem_mb: 32000, runtime: 360}

  traffic_archetypes:
    file: traffic_archetypes.py
    tier: traffic_tcr
    lineage: na
    tcr_required: true
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - results/06c_empirical_Q/migration_rates.csv
      - results/06c_empirical_Q/P_empirical.csv
    writes:
      - results/traffic_archetypes/clone_archetypes.csv
      - results/traffic_archetypes/archetype_summary.csv
      - results/traffic_archetypes/archetype_prototypes.npz
      - results/traffic_archetypes/null_comparison.csv
      - results/traffic_archetypes/silhouette_sweep.csv
      - results/traffic_archetypes/silhouette_sweep.png
      - results/traffic_archetypes/archetype_prototypes.png
      - results/traffic_archetypes/archetype_umap.png
      - results/traffic_archetypes/null_comparison.png
      - results/traffic_archetypes/archetype_phenotypes.png
    depends_on: [qc_scrublet_doublets, traffic_migration_rates]
    resources: {mem_mb: 16000, runtime: 300}

  traffic_pseudotime_phenotypes_cd8:
    file: traffic_pseudotime_phenotypes.py
    tier: traffic_tcr
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/13_pseudotime_phenotypes/CD8/fig3_pseudotime_profiles_CD8.png
    depends_on: [qc_scrublet_doublets]
    cli_extra: ["--lineage", "CD8"]
    resources: {mem_mb: 32000, runtime: 180}

  traffic_pseudotime_phenotypes_cd4:
    file: traffic_pseudotime_phenotypes.py
    tier: traffic_tcr
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/13_pseudotime_phenotypes/CD4/fig3_pseudotime_profiles_CD4.png
    depends_on: [qc_scrublet_doublets]
    cli_extra: ["--lineage", "CD4"]
    resources: {mem_mb: 32000, runtime: 180}

  traffic_phenotype_degs:
    file: traffic_phenotype_degs.py
    tier: traffic_tcr
    lineage: tcell
    reads:
      - results/13_pseudotime_phenotypes/CD8/pseudotime.csv
      - results/13_pseudotime_phenotypes/CD4/pseudotime.csv
    writes:
      - results/14_phenotype_degs/summary.csv
    depends_on: [traffic_pseudotime_phenotypes_cd8, traffic_pseudotime_phenotypes_cd4]
    resources: {mem_mb: 32000, runtime: 120}

  signaling_branch_intersection:
    file: signaling_branch_intersection.py
    tier: signaling
    lineage: tcell
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_MYELOID_combined.h5ad]
    writes:
      - results/06b_branch_signaling/branches.csv
    depends_on: []
    resources: {mem_mb: 64000, runtime: 480}

  signaling_liana_pathways:
    file: signaling_liana_pathways.py
    tier: signaling
    lineage: both
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_MYELOID_combined.h5ad
      - results/10_temporal_scores/pathway_definitions.csv
      - results/11_cross_lineage_correlations/pathway_correlations.csv
    writes:
      - results/12_liana_signaling/signaling_edges.csv
    depends_on: [pathway_temporal_scores_tcell, pathway_cross_lineage_corr]
    resources: {mem_mb: 64000, runtime: 720}

  signaling_intersect_pathways:
    file: signaling_intersect_pathways.py
    tier: signaling
    lineage: both
    reads: [results/12_liana_signaling/signaling_edges.csv]
    writes:
      - results/12_liana_signaling/signaling_edges_summary.csv
    depends_on: [signaling_liana_pathways]
    resources: {mem_mb: 8000, runtime: 30}

  figure_main2_trafficking:
    file: figure_main2_trafficking.py
    tier: figures
    lineage: tcell
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - data/embeddings/X_umap.pkl
      - results/06c_empirical_Q/migration_rates.csv
      - results/06d_empirical_Q_per_timepoint/block_retention_per_timepoint.csv
      - results/transcriptome_similarity/cosine_distance_summary.csv
    writes:
      - results/07_figure2/figure2.png
    depends_on:
      - qc_scrublet_doublets
      - traffic_migration_rates
      - traffic_migration_rates_per_tp
      - traffic_transcriptome_cosine
    resources: {mem_mb: 32000, runtime: 120}

  explorer_temporal:
    file: viewers/build/temporal.py
    tier: explorers
    lineage: tcell
    reads:
      - results/10_temporal_scores/temporal_composition_tcell.csv
      - results/10_temporal_scores/temporal_composition_myeloid.csv
      - results/10_temporal_scores/temporal_pathway_scores_tcell.csv
      - results/10_temporal_scores/temporal_pathway_scores_myeloid.csv
      - results/10_temporal_scores/temporal_gene_expression_tcell.csv
      - results/10_temporal_scores/temporal_gene_expression_myeloid.csv
    writes: [deploy/bundle/temporal.html]
    depends_on: [pathway_temporal_scores_tcell, pathway_temporal_scores_myeloid]
    resources: {mem_mb: 8000, runtime: 30}

  explorer_signaling:
    file: viewers/build/signaling.py
    tier: explorers
    lineage: both
    reads:
      - results/12_liana_signaling/signaling_edges.csv
      - results/11_cross_lineage_correlations/pathway_correlations.csv
    writes: [deploy/bundle/signaling.html]
    depends_on: [signaling_liana_pathways, pathway_cross_lineage_corr]
    resources: {mem_mb: 8000, runtime: 30}

  explorer_clone_network:
    file: viewers/build/clone_network.py
    tier: explorers
    lineage: both
    reads:
      - results/06_branch_empirics/edge_metrics_table.csv
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - data/objects/MYELOID_GBM.h5ad
    writes:
      - deploy/bundle/clone_network.html
      - results/clone_network_explorer/data_summary.txt
    depends_on: [qc_scrublet_doublets, traffic_branch_empirics]
    resources: {mem_mb: 32000, runtime: 120}

  explorer_full_report:
    file: viewers/build/report.py
    tier: explorers
    lineage: both
    reads:
      - results/10_temporal_scores/temporal_composition_tcell.csv
    writes: [deploy/bundle/report/index.html]
    depends_on: []
    note: Aggregator — run last after other tiers
    resources: {mem_mb: 8000, runtime: 30}

  viewer_landing:
    file: viewers/build/landing.py
    tier: explorers
    lineage: both
    reads:
      - deploy/bundle/temporal.html
      - deploy/bundle/signaling.html
      - deploy/bundle/clone_network.html
      - deploy/bundle/report/index.html
    writes: [deploy/bundle/index.html]
    depends_on:
      - explorer_temporal
      - explorer_signaling
      - explorer_clone_network
      - explorer_full_report
    resources: {mem_mb: 512, runtime: 1}

# Snakemake aggregate targets
targets:
  all_pathway:
    - qc_scrublet_doublets
    - pathway_temporal_scores_tcell
    - pathway_temporal_scores_myeloid
    - pathway_cross_lineage_corr
    - pathway_cross_lineage_corr_fine
    - pathway_de_gsea_prerank
    - pathway_de_gsea_myeloid
    - pathway_tissue_ternary
    - pathway_coenrichment_graph
    - pathway_proximity_network
    - traffic_tissue_separability_myeloid
    - traffic_transcriptome_cosine_myeloid
  all_traffic_tcr:
    - traffic_tissue_separability
    - traffic_migration_rates
    - traffic_migration_rates_per_tp
    - traffic_migration_rates_figures
    - traffic_bayesian_comparison
    - traffic_bayesian_sankey
    - traffic_branch_empirics
    - traffic_branch_dispersion
    - traffic_branch_dispersion_jsd
    - traffic_branch_dispersion_switching
    - traffic_branch_dispersion_temporal
    - traffic_clonality
    - traffic_clonal_persistence
    - traffic_temporal_trajectories
    - traffic_pseudotime_phenotypes_cd8
    - traffic_pseudotime_phenotypes_cd4
    - traffic_phenotype_degs
    - traffic_transcriptome_cosine
  all_signaling:
    - signaling_branch_intersection
    - signaling_liana_pathways
    - signaling_intersect_pathways
  all:
    tiers: [qc, pathway_tcell, pathway_myeloid, pathway_cross, traffic_tcr, signaling, figures, explorers]
