      - results/traffic_drainage_rewiring/CSF_to_TP/CD4/panel.pdf
      - results/traffic_drainage_rewiring/CSF_to_TP/CD4/rewiring_genes.csv
      - results/traffic_drainage_rewiring/CSF_to_TP/CD4/rewiring_genes_fullexpr.csv
      - results/traffic_drainage_rewiring/CSF_to_TP/CD4/selected_genes.csv
      - results/traffic_drainage_rewiring/CSF_to_TP/CD4/tf_target_links.csv
      - results/traffic_drainage_rewiring/CSF_to_TP/CD4/gsea.csv
      # PBMC → CSF
      - results/traffic_drainage_rewiring/PBMC_to_CSF/CD8/panel.png
      - results/traffic_drainage_rewiring/PBMC_to_CSF/CD8/rewiring_genes_fullexpr.csv
      - results/traffic_drainage_rewiring/PBMC_to_CSF/CD4/panel.png
      - results/traffic_drainage_rewiring/PBMC_to_CSF/CD4/rewiring_genes_fullexpr.csv
      # PBMC → TP
      - results/traffic_drainage_rewiring/PBMC_to_TP/CD8/panel.png
      - results/traffic_drainage_rewiring/PBMC_to_TP/CD8/rewiring_genes_fullexpr.csv
      - results/traffic_drainage_rewiring/PBMC_to_TP/CD4/panel.png
      - results/traffic_drainage_rewiring/PBMC_to_TP/CD4/rewiring_genes_fullexpr.csv
      # Reverse-direction transitions (CSF→PBMC, TP→CSF, TP→PBMC) are
      # generated when data exists but are not enumerated here — they
      # are typically sparse. Check run_summary.csv for the populated set.
    depends_on: [traffic_archetype_graphs]
    resources: {mem_mb: 32000, runtime: 600}

  traffic_pseudotime_phenotypes_cd8:
    file: traffic_pseudotime_phenotypes.py
    tier: traffic_tcr
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/traffic_pseudotime_phenotypes/CD8/fig3_pseudotime_profiles_CD8.png
    depends_on: [qc_scrublet_doublets]
    cli_extra: ["--lineage", "CD8"]
    resources: {mem_mb: 32000, runtime: 180}

  traffic_pseudotime_phenotypes_cd4:
    file: traffic_pseudotime_phenotypes.py
    tier: traffic_tcr
    lineage: tcell
    reads: [data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad]
    writes:
      - results/traffic_pseudotime_phenotypes/CD4/fig3_pseudotime_profiles_CD4.png
    depends_on: [qc_scrublet_doublets]
    cli_extra: ["--lineage", "CD4"]
    resources: {mem_mb: 32000, runtime: 180}

  traffic_phenotype_degs:
    file: traffic_phenotype_degs.py
    tier: traffic_tcr
    lineage: tcell
    reads:
      - results/traffic_pseudotime_phenotypes/CD8/pseudotime.csv
      - results/traffic_pseudotime_phenotypes/CD4/pseudotime.csv
    writes:
      - results/traffic_phenotype_degs/summary.csv
    depends_on: [traffic_pseudotime_phenotypes_cd8, traffic_pseudotime_phenotypes_cd4]
    resources: {mem_mb: 32000, runtime: 120}

  signaling_branch_intersection:
    file: signaling_branch_intersection.py
    tier: signaling
    lineage: tcell
    tcr_required: true
    reads: [data/objects/GBM_TCR_POS_TCELLS_MYELOID_combined.h5ad]
    writes:
      - results/signaling_branch_intersection/branches.csv
    depends_on: []
    resources: {mem_mb: 64000, runtime: 480}

  signaling_liana_pathways:
    file: signaling_liana_pathways.py
    tier: signaling
    lineage: both
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_MYELOID_combined.h5ad
      - results/pathway_temporal_scores/pathway_definitions.csv
      - results/pathway_cross_lineage_corr/pathway_correlations.csv
    writes:
      - results/signaling_liana_pathways/signaling_edges.csv
    depends_on: [pathway_temporal_scores_tcell, pathway_cross_lineage_corr]
    resources: {mem_mb: 64000, runtime: 720}

  signaling_intersect_pathways:
    file: signaling_intersect_pathways.py
    tier: signaling
    lineage: both
    reads: [results/signaling_liana_pathways/signaling_edges.csv]
    writes:
      - results/signaling_liana_pathways/signaling_edges_summary.csv
    depends_on: [signaling_liana_pathways]
    resources: {mem_mb: 8000, runtime: 30}

  figure_main2_trafficking:
    file: figure_main2_trafficking.py
    tier: figures
    lineage: tcell
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - data/embeddings/X_umap.pkl
      - results/traffic_migration_rates/migration_rates.csv
      - results/traffic_migration_rates_per_tp/block_retention_per_timepoint.csv
      - results/traffic_transcriptome_cosine/cosine_distance_summary.csv
    writes:
      - results/figure_main2_trafficking/figure2.png
    depends_on:
      - qc_scrublet_doublets
      - traffic_migration_rates
      - traffic_migration_rates_per_tp
      - traffic_transcriptome_cosine
    resources: {mem_mb: 32000, runtime: 120}

  figure_cd8_drainage_integrated:
    file: figure_cd8_drainage_integrated.py
    tier: figures
    lineage: tcell
    tcr_required: true
    reads:
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - results/traffic_archetype_graphs/clone_archetypes.csv
      - results/traffic_drainage_rewiring/CSF_to_TP/CD8/rewiring_genes_fullexpr.csv
      - results/traffic_bayesian_sankey/T_CD8_CSF_to_TP.csv
    writes:
      - results/figure_cd8_drainage_integrated/events_meta.csv
      - results/figure_cd8_drainage_integrated/ribbon_summary.csv
      - results/figure_cd8_drainage_integrated/ribbon_gene_deltas.csv
      - results/figure_cd8_drainage_integrated/top_genes.csv
      - results/figure_cd8_drainage_integrated/bayesian_sankey_csf_tp.csv
      - results/figure_cd8_drainage_integrated/main.png
      - results/figure_cd8_drainage_integrated/main.pdf
    depends_on: [traffic_archetype_graphs, traffic_drainage_rewiring, traffic_bayesian_sankey]
    resources: {mem_mb: 32000, runtime: 60}

  explorer_temporal:
    file: viewers/build/temporal.py
    tier: explorers
    lineage: tcell
    reads:
      - results/pathway_temporal_scores/temporal_composition_tcell.csv
      - results/pathway_temporal_scores/temporal_composition_myeloid.csv
      - results/pathway_temporal_scores/temporal_pathway_scores_tcell.csv
      - results/pathway_temporal_scores/temporal_pathway_scores_myeloid.csv
      - results/pathway_temporal_scores/temporal_gene_expression_tcell.csv
      - results/pathway_temporal_scores/temporal_gene_expression_myeloid.csv
    writes: [deploy/bundle/temporal.html]
    depends_on: [pathway_temporal_scores_tcell, pathway_temporal_scores_myeloid]
    resources: {mem_mb: 8000, runtime: 30}

  explorer_signaling:
    file: viewers/build/signaling.py
    tier: explorers
    lineage: both
    reads:
      - results/signaling_liana_pathways/signaling_edges.csv
      - results/pathway_cross_lineage_corr/pathway_correlations.csv
    writes: [deploy/bundle/signaling.html]
    depends_on: [signaling_liana_pathways, pathway_cross_lineage_corr]
    resources: {mem_mb: 8000, runtime: 30}

  explorer_clone_network:
    file: viewers/build/clone_network.py
    tier: explorers
    lineage: both
    reads:
      - results/traffic_branch_empirics/edge_metrics_table.csv
      - data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad
      - data/objects/MYELOID_GBM.h5ad
    writes:
      - deploy/bundle/clone_network.html
      - results/explorer_clone_network/data_summary.txt
    depends_on: [qc_scrublet_doublets, traffic_branch_empirics]
    resources: {mem_mb: 32000, runtime: 120}

  explorer_full_report:
    file: viewers/build/report.py
    tier: explorers
    lineage: both
    reads:
      - results/pathway_temporal_scores/temporal_composition_tcell.csv
    writes: [deploy/bundle/report/index.html]
    depends_on: []
    note: Aggregator — run last after other tiers
    resources: {mem_mb: 8000, runtime: 30}

  viewer_landing:
    file: viewers/build/landing.py
    tier: explorers
    lineage: both
    reads:
      - deploy/bundle/temporal.html
      - deploy/bundle/signaling.html
      - deploy/bundle/clone_network.html
      - deploy/bundle/report/index.html
    writes: [deploy/bundle/index.html]
    depends_on:
      - explorer_temporal
      - explorer_signaling
      - explorer_clone_network
      - explorer_full_report
    resources: {mem_mb: 512, runtime: 1}

