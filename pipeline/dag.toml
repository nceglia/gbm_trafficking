# Pipeline DAG — machine-readable.
#
# Each [steps.<name>] entry declares what the step reads and writes.
# `depends_on` lists upstream step names (derived from `reads` matching
# another step's `writes`). External inputs (data/objects/, gseapy
# library calls, hard-coded h5ad paths) are not dependencies.
#
# Step names below are the CURRENT (numeric) filenames. After the
# pipeline rename, this file gets regenerated against the new names.

# -------- QC / preprocessing --------

[steps."scrublet_doublet_qc"]
file = "scrublet_doublet_qc.py"
domain = "qc"
reads = ["data/objects/GBM_TCR_POS_TCELLS.h5ad"]
writes = ["data/objects/GBM_TCR_POS_TCELLS_singlets.h5ad",
          "results/qc_doublets/"]
depends_on = []

[steps."celltyping"]
file = "celltyping.py"
domain = "qc"
reads = ["(external 10x h5ad, no REPO_ROOT)"]
writes = ["(interactive, no tracked output)"]
depends_on = []
warning = "no REPO_ROOT; only runs from pipeline/ cwd"

