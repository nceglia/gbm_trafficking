# Static file server for the GBM trafficking viewer bundle on slvicosspecdat1.
#
# The VM currently has no nginx/Apache and no /var/www. This config is meant
# for an admin-managed nginx install. Point root at the atomic current symlink.
#
# Optional basic auth:
#   sudo dnf install httpd-tools
#   htpasswd -c /etc/nginx/gbm-viewer.htpasswd collaborator
#
# Then install:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/gbm-viewer.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    server_name _;

    root /home/ceglian/gbm-viewer/current;
    index index.html;

    # Internal/VPN-only, but add light auth for collaborator reassurance.
    auth_basic "GBM Trafficking Viewers";
    auth_basic_user_file /etc/nginx/gbm-viewer.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|css|js|json|csv|tsv|txt|png|jpg|jpeg|svg|pdf)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/csv text/tab-separated-values text/plain image/svg+xml;
}
