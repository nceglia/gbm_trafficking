# Static file server for deploy/bundle/ on a small VM.
#
# Install (Debian/Ubuntu):
#   sudo apt install nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gbm-viewer
#   sudo ln -sf /etc/nginx/sites-available/gbm-viewer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Point root at the synced bundle directory.

server {
    listen 8080;
    server_name _;

    root /var/www/gbm-viewer;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Large self-contained HTML explorers — allow long cache after deploy
    location ~* \.(html|css|js|json|csv|png|jpg|svg)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/csv;
}
